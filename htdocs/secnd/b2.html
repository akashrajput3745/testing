<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just i </title>
    <style>
        * {
            margin: 0px;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(45deg, #d975f5, #d21e84);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

        }

        .result_area {
            text-align: center;
        }

        form {
            max-width: 600px;
            display: flex;
            justify-content: space-evenly;
            /* flex-direction: row; */
            align-items: center;
            flex-wrap: wrap;
            padding: 80px;
            background-color: rgba(209, 89, 227, 0.4);
            backdrop-filter: blur(10px);
            /* background: rgba(255, 255, 255, 0.708); */
            overflow: hidden;
        }

        form::after,
        form::before {
            position: absolute;
            content: " ";
            flex-basis: 100%;
            top: 100%;
            left: 100%;
            height: 0px;
            width: 0px;
            border-radius: 50%;
            box-shadow: 0 0 40px 30px #0bd0f3;
            background-color: aqua;
            z-index: -1;
            animation: move 8s infinite linear;
        }

        form::before {
            animation-delay: 2.5s;
            box-shadow: 0 0 40px 30px #ffe600;
            background-color: #f26d99;
        }


        @keyframes move {
            0% {
                top: 20%;
                left: 20%;
            }

            25% {
                top: 20%;
                left: 80%;
            }

            50% {
                top: 80%;
                left: 80%;
            }

            75% {
                top: 80%;
                left: 20%;
            }

            100% {
                top: 20%;
                left: 20%;
            }
        }

        form input {
            width: 150px;
            height: 20px;
            border: 1px solid rgb(122, 83, 207);
            border-radius: 5px;
            margin: 10px;

            /* flex-grow: inherit; */
        }

        .buttton {
            text-align: center;
            width: 80%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f26d99;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <form>
        <input type="text" name="str" id="str" placeholder="Enter String">
        <br>
        <span class="buttton" onclick="ajax()">Try</span>
    </form>
    <div class="result_area" id="demo">

    </div>
    <script src="main.js"></script>
</body>

</html>
