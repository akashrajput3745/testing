<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just i </title>
    <style>
        * {
            margin: 0px;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(45deg, #d975f5, #d21e84);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);

        }



        form {
            max-width: 600px;
            display: flex;
            justify-content: space-evenly;
            flex-direction: column;
            align-items: center;
            flex-wrap: wrap;
            padding: 80px;
            background-color: rgba(209, 89, 227, 0.4);
            backdrop-filter: blur(10px);
            /* background: rgba(255, 255, 255, 0.708); */
            overflow: hidden;
        }

        form::after,
        form::before {
            position: absolute;
            content: " ";
            flex-basis: 100%;
            top: 100%;
            left: 100%;
            height: 0px;
            width: 0px;
            border-radius: 50%;
            box-shadow: 0 0 40px 30px #0bd0f3;
            background-color: aqua;
            z-index: -1;
            animation: move 8s infinite linear;
        }

        form::before {
            animation-delay: 2.5s;
            box-shadow: 0 0 40px 30px #ffe600;
            background-color: #f26d99;
        }


        @keyframes move {
            0% {
                top: 20%;
                left: 20%;
            }

            25% {
                top: 20%;
                left: 80%;
            }

            50% {
                top: 80%;
                left: 80%;
            }

            75% {
                top: 80%;
                left: 20%;
            }

            100% {
                top: 20%;
                left: 20%;
            }
        }

        form input {
            width: 150px;
            height: 20px;
            border: 1px solid rgb(122, 83, 207);
            border-radius: 5px;
            margin: 10px;

            /* flex-grow: inherit; */
        }

        .buttton {
            text-align: center;
            width: 80%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f26d99;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* From Uiverse.io by gharsh11032000 */
        .card {
            width: 400px;
            height: 200px;
            background-color: #4158D0;
            background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            border-radius: 8px;
            color: white;
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            cursor: pointer;
        }

        .card-content {
            padding: 20px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: white;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        .card-content .card-title {
            font-size: 20px;
            
            color: inherit;
            
        }

        .card-content .card-para {
            color: inherit;
            opacity: 0.8;
            font-size: 14px;
        }

        .card:hover {
            transform: rotateY(10deg) rotateX(10deg) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.1));
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            z-index: 1;
        }

        .card:hover:before {
            transform: translateX(-100%);
        }

        .card:after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.1));
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            z-index: 1;
        }

        .card:hover:after {
            transform: translateX(100%);
        }
    </style>
</head>

<body>
    <form>
        <input type="text" id="str1" value="hi" placeholder="Enter small string">
        <input type="text" id="str2" value="hello and hi" placeholder="Enter big string">
        <input type="number" id="num" value="3" placeholder="Enter n number">
        <span class="buttton" onclick="send()">Try</span>
    </form>
    <div class="result_area" id="demo">

    </div>

    <script>
        async function send() {
            console.log("hello");
            let str1 = document.getElementById("str1").value;
            let str2 = document.getElementById("str2").value;
            let num = document.getElementById("num").value;
            let data = { str1, str2 };
            var http = new XMLHttpRequest();
            http.onreadystatechange = function () {
                console.log(this.readyState, this.status);
                if (this.status == 200 && this.readyState == 4) {
                    console.log("   hi ")
                    console.log(this.responseText)
                    document.getElementById("demo").innerHTML = ` <div class="card">
            <div class="card-content">
                <p class="card-title">${this.responseText}
                </p>
                <p class="card-para">.</p>
            </div>
        </div>`;
                }
            }
            http.open("POST", "index1.php", true);
            http.setRequestHeader("Content-type", "application/x-www-form-urlencoded")

            http.send("str1=" + str1 + "&str2=" + str2 + "&num=" + num);
        }
    </script>


</body>

</html>
