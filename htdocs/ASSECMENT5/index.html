<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: #000;
        }
        nav{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        nav .btn{
            width: 50px;    
            height: 50px;
            background: #222;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.5s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        nav .btn:hover{
            background: #ff0057;
            box-shadow: 0 0 15px rgba(255,0,87,0.6);
            transform: scale(1.2);
        }
        .main{
            width: 100%;
            height: calc(100% - 70px);
            background: #d1d0d0;
        }
        #displayFrame{
            margin-top: 50px;
            width: 100%;
            height: 90%;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="btn" > A1 </a>
        <a href="#" class="btn" > A2 </a>
        <a href="#" class="btn" > B1 </a>
        <a href="#" class="btn" > B2 </a>
        <a href="#" class="btn" > C1 </a>
        <a href="#" class="btn" > C2 </a>
    </nav>
    <div class="main">
        <iframe id="displayFrame" src="QA1.php"></iframe> <!-- default page -->

    </div>
    <script>
        var fream = document.getElementById('displayFrame')
        function changeFream(src){
            fream.src = src;
        }
        var btns = document.querySelectorAll('.btn');
        btns[0].onclick = function(){ changeFream('QA1.php') }
        btns[1].onclick = function(){ changeFream('QA2index.php') }
        btns[2].onclick = function(){ changeFream('QB1.php') }
        btns[3].onclick = function(){ changeFream('QB2.php') }
        btns[4].onclick = function(){ changeFream('QC1.php') }
        btns[5].onclick = function(){ changeFream('QC2.php') }
    </script>
</body>
</html>
