<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Website Effects Demo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #817f7f;
        color: #eaeaea;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
        padding: 40px;
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
        color: #00bcd4;
    }

    /* 1. Shadow Effect */
    .shadow-card {
        background: #fff;
        color: #000;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        width: 220px;
    }
    .shadow-card h3 {
        text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    }

    /* 2. 3D Transform */
    .box {
        width: 150px;
        height: 150px;
        background: linear-gradient(45deg, #0078d7, #00bcd4);
        transform: rotateY(25deg) rotateX(10deg);
        transform-style: preserve-3d;
        border-radius: 10px;
    }

    /* 3. Perspective */
    .scene {
        perspective: 800px;
    }
    .scene .card {
        width: 200px;
        height: 120px;
        background: #ff5722;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        transform: rotateY(30deg);
        border-radius: 10px;
    }

    /* 4. Interactive Hover */
    .hover-card {
        width: 250px;
        height: 150px;
        background: #673ab7;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        border-radius: 12px;
        transition: transform 0.4s;
    }
    .hover-card:hover {
        transform: rotateY(15deg) rotateX(10deg) scale(1.05);
    }

    /* 5. 3D Button */
    .btn {
        padding: 12px 20px;
        background: #4CAF50;
        color: #fff;
        border: none;
        border-radius: 6px;
        box-shadow: 0 5px #388E3C;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s ease;
    }
    .btn:active {
        box-shadow: 0 2px #388E3C;
        transform: translateY(3px);
    }

    /* 6. 3D Cube */
    .cube-scene {
        perspective: 800px;
        width: 120px;
        height: 120px;
    }
    .cube {
        width: 100px;
        height: 100px;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateX(-30deg) rotateY(-30deg);
        animation: spin 6s infinite linear;
    }
    .cube div {
        position: absolute;
        width: 100px;
        height: 100px;
        background: rgba(33,150,243,0.8);
        border: 2px solid #fff;
    }
    .cube .front  { transform: translateZ(50px); }
    .cube .back   { transform: rotateY(180deg) translateZ(50px); }
    .cube .right  { transform: rotateY(90deg) translateZ(50px); }
    .cube .left   { transform: rotateY(-90deg) translateZ(50px); }
    .cube .top    { transform: rotateX(90deg) translateZ(50px); }
    .cube .bottom { transform: rotateX(-90deg) translateZ(50px); }

    @keyframes spin {
        from { transform: rotateX(-30deg) rotateY(-30deg); }
        to { transform: rotateX(-30deg) rotateY(330deg); }
    }

</style>
</head>
<body>

    <!-- 1. Shadow Effect -->
    <div>
        <h2>Shadow Effect</h2>
        <div class="shadow-card">
            <h3>Floating Card</h3>
            <p>This card uses box-shadow and text-shadow.</p>
        </div>
    </div>

    <!-- 2. 3D Transform -->
    <div>
        <h2>3D Transform</h2>
        <div class="box"></div>
    </div>

    <!-- 3. Perspective -->
    <div>
        <h2>Perspective</h2>
        <div class="scene">
            <div class="card">Perspective Card</div>
        </div>
    </div>

    <!-- 4. Interactive Hover -->
    <div>
        <h2>Hover 3D Effect</h2>
        <div class="hover-card">Hover Me</div>
    </div>

    <!-- 5. 3D Button -->
    <div>
        <h2>3D Button</h2>
        <button class="btn">Click Me</button>
    </div>

    <!-- 6. 3D Cube -->
    <div>
        <h2>3D Rotating Cube</h2>
        <div class="cube-scene">
            <div class="cube">
                <div class="front"></div>
                <div class="back"></div>
                <div class="right"></div>
                <div class="left"></div>
                <div class="top"></div>
                <div class="bottom"></div>
            </div>
        </div>
    </div>

</body>
</html>
