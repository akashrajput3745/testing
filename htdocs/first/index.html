<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glassy Form</title>
    <style>
        body {
            background: linear-gradient(45deg, #6db3f2, #1e69d2);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        .form-container h2 {
            color: white;
            margin-bottom: 20px;
        }

        .input-field {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #6db3f2;
        }

        .submit-btn {
            width: 80%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #6db3f2;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #1e69d2;
        }

        .response {
            margin-top: 20px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Submit Your Info</h2>
        <input type="text" id="input1" class="input-field" placeholder="Enter first value" required>
        <input type="text" id="input2" class="input-field" placeholder="Enter second value" required>
        <button class="submit-btn" onclick="sendData()">Submit</button>
        <div class="response" id="response"></div>
    </div>

    <script>
        function sendData() {
            // Get input values
            const input1 = document.getElementById('input1').value;
            const input2 = document.getElementById('input2').value;

            // Create data object
            const data = {
                input1: input1,
                input2: input2
            };

            // Use Fetch API to send data via POST method
            fetch('first/server.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())  // Assuming server returns a JSON response
                .then(data => {
                    // Show the response from the PHP server
                    if (data.status === 'success') {
                        document.getElementById('response').innerHTML = `
                    <strong>Results:</strong><br>
                    <b>Modulus:</b> ${data.modulus}<br>
                    <b>Power:</b> ${data.power}<br>
                    <b>Sum of First N Numbers:</b> ${data.sumOfNumbers}<br>
                    <b>Factorial:</b> ${data.factorial}
                `;
                    } else {
                        document.getElementById('response').innerText = data.message;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('response').innerText = 'An error occurred';
                });
        }
    </script>

</body>

</html>
